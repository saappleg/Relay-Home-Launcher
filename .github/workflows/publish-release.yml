name: Publish Relay Home release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
      version_name:
        description: Version name (for example 0.1.0-alpha.1)
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string
      release_notes:
        description: Short release notes
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Relay Home
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          (( VERSION_CODE <= 2100000000 ))
          case "$CHANNEL" in
            alpha)
              [[ "$VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.([1-9][0-9]*)$ ]]
              ;;
            beta)
              [[ "$VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$ ]]
              ;;
            stable)
              [[ "$VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

      - name: Validate version code against published APKs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f -perm -111 | sort -V | tail -1)"
          test -x "$AAPT2"
          URLS_FILE="$RUNNER_TEMP/relay-published-apk-urls.txt"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .assets[]? | select((.name // "" | ascii_downcase | endswith(".apk")) and ((.browser_download_url // "") | startswith("https://"))) | .browser_download_url' \
            > "$URLS_FILE"
          highest_code=0
          while IFS= read -r asset_url; do
            [[ -n "$asset_url" ]] || continue
            case "$asset_url" in
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/"*) ;;
              *)
                echo "Previously published APK has an unexpected GitHub asset URL: $asset_url" >&2
                exit 1
                ;;
            esac
            asset_file="$RUNNER_TEMP/relay-published-$RANDOM.apk"
            if ! effective_url="$(curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
              --max-redirs 5 --proto '=https' --proto-redir '=https' --max-filesize 209715200 \
              --write-out '%{url_effective}' --output "$asset_file" "$asset_url")"; then
              echo "Could not inspect previously published APK $asset_url; refusing to prove version monotonicity." >&2
              exit 1
            fi
            case "$effective_url" in
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/"*|\
              https://objects.githubusercontent.com/*|https://*.githubusercontent.com/*) ;;
              *)
                echo "Previously published APK redirected to an unexpected host: $effective_url" >&2
                exit 1
                ;;
            esac
            asset_size="$(wc -c < "$asset_file")"
            (( asset_size >= 262144 && asset_size <= 209715200 )) || {
              echo "Previously published APK has an invalid size: $asset_url" >&2
              exit 1
            }
            badging="$("$AAPT2" dump badging "$asset_file" 2>/dev/null || true)"
            package_line="$(printf '%s\n' "$badging" | grep -F "package: name='com.relayhome.launcher' " || true)"
            [[ -n "$package_line" ]] || {
              echo "Previously published APK is not a valid Relay Home APK: $asset_url" >&2
              exit 1
            }
            code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode=['\"]\\([0-9][0-9]*\\)['\"].*/\\1/p" | head -1)"
            [[ "$code" =~ ^[0-9]+$ ]] || {
              echo "Could not read versionCode from previously published APK: $asset_url" >&2
              exit 1
            }
            if (( code > highest_code )); then highest_code="$code"; fi
            rm -f "$asset_file"
          done < "$URLS_FILE"
          (( VERSION_CODE > highest_code )) || {
            echo "Version code $VERSION_CODE must be greater than published APK version code $highest_code." >&2
            exit 1
          }

      - name: Configure release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$TMDB_API_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/relay-home-release.p12"
          chmod 600 "$GITHUB_WORKSPACE/relay-home-release.p12"
          test -s "$GITHUB_WORKSPACE/relay-home-release.p12"
          keytool -list -noprompt -storetype PKCS12 \
            -keystore "$GITHUB_WORKSPACE/relay-home-release.p12" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build and verify signed APK
        env:
          RELAY_VERSION_CODE: ${{ inputs.version_code }}
          RELAY_VERSION_NAME: ${{ inputs.version_name }}
          RELAY_SIGNING_STORE_FILE: ${{ github.workspace }}/relay-home-release.p12
          RELAY_SIGNING_STORE_TYPE: PKCS12
          RELAY_SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELAY_SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELAY_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELAY_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease
          mkdir -p release-assets
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "release-assets/relay-home-${RELAY_VERSION_NAME}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f -perm -111 | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT2"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "release-assets/relay-home-${RELAY_VERSION_NAME}.apk" 2>&1)"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="$(keytool -exportcert -noprompt -storetype PKCS12 \
            -keystore "$RELAY_SIGNING_STORE_FILE" -storepass "$RELAY_SIGNING_STORE_PASSWORD" \
            -alias "$RELAY_SIGNING_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          [[ -n "$ACTUAL_CERT" && "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
            echo "APK signer does not match the configured release keystore." >&2
            exit 1
          }
          badging="$("$AAPT2" dump badging "$APK" 2>/dev/null || true)"
          printf '%s\n' "$badging" | grep -F "package: name='com.relayhome.launcher' versionCode='$RELAY_VERSION_CODE' versionName='$RELAY_VERSION_NAME'"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          [[ -n "${RELEASE_NOTES//[[:space:]]/}" ]]
          TAG_NAME="v${VERSION_NAME}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $TAG_NAME." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "A Git tag already exists for $TAG_NAME." >&2
            exit 1
          fi
          if [ "$CHANNEL" = "alpha" ] || [ "$CHANNEL" = "beta" ]; then
            gh release create "$TAG_NAME" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Relay Home ${VERSION_NAME}" \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --latest=false
          else
            gh release create "$TAG_NAME" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Relay Home ${VERSION_NAME}" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Verify published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          TAG_NAME="v${VERSION_NAME}"
          release_json="$(gh release view "$TAG_NAME" --json tagName,isDraft,isPrerelease,assets)"
          printf '%s' "$release_json" | jq -e --arg tag "$TAG_NAME" '.tagName == $tag' >/dev/null
          printf '%s' "$release_json" | jq -e '.isDraft == false' >/dev/null
          if [ "$CHANNEL" = "stable" ]; then
            printf '%s' "$release_json" | jq -e '.isPrerelease == false' >/dev/null
          else
            printf '%s' "$release_json" | jq -e '.isPrerelease == true' >/dev/null
          fi
          printf '%s' "$release_json" | jq -e --arg asset "relay-home-${VERSION_NAME}.apk" '.assets | map(select(.name == $asset)) | length == 1' >/dev/null

      - name: Remove release signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/relay-home-release.p12"
