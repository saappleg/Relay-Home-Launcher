name: Build Android TV APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:


jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Run JVM unit tests
        run: ./gradlew test

  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      -
        uses: actions/upload-artifact@v4
        with:
          name: relay-home-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  connected_scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether instrumentation is relevant
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          should_run=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              app/src/main/*|app/src/androidTest/*|app/build.gradle.kts|gradle/libs.versions.toml|gradle/wrapper/*|gradlew|gradlew.bat|settings.gradle.kts|build.gradle.kts|gradle.properties)
                should_run=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...HEAD")
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  connected-check:
    # Run manually, nightly, and for PRs that can affect Android behavior or tests.
    needs: connected_scope
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'pull_request' && needs.connected_scope.outputs.should_run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Run connected Android tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: ./gradlew :app:connectedCheck
