name: Build Android TV APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Create ephemeral signing key for release unit tests
        run: |
          keytool -genkeypair -noprompt \
            -alias relay-home-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/relay-home-ci.jks" \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Relay Home CI, OU=Tests, O=Relay Home, L=CI, ST=CI, C=US"
      - name: Run JVM unit tests
        env:
          RELAY_SIGNING_STORE_FILE: ${{ runner.temp }}/relay-home-ci.jks
          RELAY_SIGNING_STORE_TYPE: JKS
          RELAY_SIGNING_STORE_PASSWORD: changeit
          RELAY_SIGNING_KEY_ALIAS: relay-home-ci
          RELAY_SIGNING_KEY_PASSWORD: changeit
        run: ./gradlew test

  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      -
        uses: actions/upload-artifact@v4
        with:
          name: relay-home-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  connected-check:
    # Instrumentation is intentionally manual-only: ordinary PRs do not need an emulator,
    # while workflow_dispatch still provides a reproducible connectedCheck path.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Run connected Android tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: ./gradlew :app:connectedCheck
